# [workspace.dependencies] の運用を強制する:
# - duplicates: member が workspace = true を使わず直接宣言したらエラー
# - unused: 誰も使っていない workspace 依存をエラー (cargo-machete では検出できない)
[bans.workspace-dependencies]
duplicates = "deny"
unused = "deny"
include-path-dependencies = true

# build script / ネイティブ実行ファイルは明示的に許可したものだけ通す。
# GUI (gpui-kit) を入れた時点で 91 クレートに増えた。2026-10 に全部の build.rs を
# 走査し、外部からのダウンロードや不審な実行が無いこと、実行する外部コマンドが
# rustc / cc などのコンパイラ probe、pkg-config / xcrun / where.exe / nasm / git と
# いったツール検出とバージョン取得、C / asm のコンパイルだけであることを確認した。
# 主な内訳:
# - probe 系 (serde / proc-macro2 / quote / libc / rustix など多数):
#   rustc とターゲットの機能判定だけで、コードは生成しない
# - ネイティブ系 (*-sys / ash / wgpu / ring / rustls / zed-font-kit):
#   pkg-config や cc でネイティブライブラリを検出・コンパイルしてリンクする
# - windows 系 (windows_* / winapi* / vswhom-sys / glutin_wgl_sys):
#   同梱の import library (.lib / .a) を展開してリンクする
# - 生成系 (gpui-kit-assets / gpui-pre-* / khronos_api / pulp):
#   OUT_DIR にコードやアセットを生成する (外部からの取得はしない)
# 追加するときは build.rs の中身を確認してから足す
[bans.build]
allow-build-scripts = [
  "ahash",
  "anyhow",
  "ash",
  "async-io",
  "cbindgen",
  "crc32fast",
  "crossbeam-deque",
  "crossbeam-epoch",
  "crossbeam-utils",
  "crunchy",
  "encoding_rs",
  "freetype-sys",
  "generic-array",
  "getrandom",
  "glutin_wgl_sys",
  "gpui-component",
  "gpui-kit-assets",
  "gpui-pre",
  "gpui-pre-apple",
  "gpui-pre-windows",
  "gpui-pre-ztracing",
  "heapless",
  "html5ever",
  "httparse",
  "iana-time-zone-haiku",
  "icu_normalizer_data",
  "icu_properties_data",
  "inotify-sys",
  "jni-sys",
  "khronos-egl",
  "khronos_api",
  "libc",
  "libm",
  "mac-notification-sys",
  "markup5ever",
  "memoffset",
  "mime_guess",
  "naga",
  "num-bigint-dig",
  "num-traits",
  "objc-sys",
  "objc2",
  "object",
  "parking_lot_core",
  "paste",
  "pathfinder_simd",
  "portable-atomic",
  "portable-atomic-util",
  "proc-macro2",
  "pulp",
  "quote",
  "rayon-core",
  "ref-cast",
  "ring",
  "rust-i18n",
  "rustix",
  "rustls",
  "rustversion",
  "serde",
  "serde_core",
  "serde_json",
  "slotmap",
  "system-configuration-sys",
  "thiserror",
  "tiny-keccak",
  "vswhom-sys",
  "wasm-bindgen",
  "wasm-bindgen-shared",
  "wayland-backend",
  "wayland-client",
  "wayland-sys",
  "wgpu",
  "wgpu-core",
  "wgpu-hal",
  "winapi",
  "winapi-i686-pc-windows-gnu",
  "winapi-x86_64-pc-windows-gnu",
  "windows_aarch64_gnullvm",
  "windows_aarch64_msvc",
  "windows_i686_gnu",
  "windows_i686_gnullvm",
  "windows_i686_msvc",
  "windows_x86_64_gnu",
  "windows_x86_64_gnullvm",
  "windows_x86_64_msvc",
  "wit-bindgen",
  "xim-parser",
  "yeslogic-fontconfig-sys",
  "zed-font-kit",
  "zerocopy",
  "zmij",
]
executables = "deny"

# git2 の https / ssh を有効にすると openssl と libssh2 (native 依存) が要るため封じる
[[bans.features]]
crate = "git2"
deny = ["https", "ssh", "vendored-openssl"]

[licenses]
confidence-threshold = 0.8
# この allow は「受け入れる方針」の一覧なので、未使用のエントリがあっても正常。
# warn にすると依存ゼロの今は毎回 8 件の警告が出て出力を読まなくなるため allow のまま
unused-allowed-license = "allow"
allow = [
  # 0BSD (BSD Zero Clause) と CC0-1.0 (パブリックドメイン相当) はどちらもコピーレフトでは
  # ないため許可する (gpui-kit の依存の enum-iterator / notify / tiny-keccak などが使う)
  "0BSD",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# コピーレフトは許可リストに入れず、特定のクレートだけ例外にする
# (0.20 の公式キーは crate。name も受理されるが使わない)
exceptions = [
  # { allow = ["LGPL-3.0"], crate = "nvim-rs", version = "*" },
  # MPL-2.0 はファイル単位の弱いコピーレフトで、他コードとリンクしても依存側へ
  # ライセンスを伝播させない (MPL-2.0 §3.3)。gpui-kit の依存では次の 3 件だけが
  # MPL-2.0 なので、許可リストには入れずクレート限定で許容する。
  # cbindgen: macOS 向け gpui-pre-apple のビルド時のみ
  # dwrote: Windows のフォント描画 (zed-font-kit 経由)、option-ext: dirs-sys 経由
  { allow = ["MPL-2.0"], crate = "cbindgen" },
  { allow = ["MPL-2.0"], crate = "dwrote" },
  { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
# publish = false のクレートはライセンス未記載を許す
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
