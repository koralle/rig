# 依存を戻すときの注意 (今は依存が無いため ignore / exceptions はコメントアウト):
# - git2: 0.21 未満は RUSTSEC-2024-0013 (libgit2 < 1.7.2 の脆弱性) と unsound 3 件
#   (RUSTSEC-2026-0008 / 0183 / 0184) を踏む。0.17 系を使うなら ignore に理由付きで
#   追加し、ローカルビルドに openssl + pkg-config が要る (cmake は不要)。
# - nvim-rs: LGPL-3.0 なので crate 限定の例外が要る。futures の io-compat を必須で
#   有効にするため tokio-io 0.1 (unmaintained / RUSTSEC-2026-0058) も必ず入る
#   (上流に修正が無く安全なアップグレードも無い)。

[advisories]
ignore = [
  # nvim-rs を戻すときに必要:
  # { id = "RUSTSEC-2026-0058", reason = "nvim-rs の必須依存 (futures io-compat) 経由。安全なアップグレードが存在しない" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
# コピーレフトは許可リストに入れず、特定のクレートだけ例外にする
exceptions = [
  # { allow = ["LGPL-3.0"], name = "nvim-rs", version = "*" },
]

[licenses.private]
# publish = false のクレートはライセンス未記載を許す
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
