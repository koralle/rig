name: Setup Rust toolchain
description: Install the Rust toolchain declared in rust-toolchain.toml

# 呼び出し側は uses: ./.github/actions/setup-rust-toolchain を使う。
# GitHub は 2026-07 に self-repository 構文 (uses: $/...) を推奨にしたが、
# actionlint が未対応 (rhysd/actionlint#711) で、$/ にすると actionlint による
# with: の入力検証も効かなくなるため、対応するまで ./ のままにする。

inputs:
  cache:
    description: Cache Cargo registry and build artifacts
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # toolchain / components は渡さず rust-toolchain.toml を読ませる
    # actions-rust-lang/setup-rust-toolchain v2.0.0
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # yamllint disable-line rule:line-length
      with:
        cache: ${{ inputs.cache }}
