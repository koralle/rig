[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0.70"
chrono = "0.4.24"
clap = { version = "4.2.2", features = ["derive"] }
crossterm = { version = "0.26.1", features = ["event-stream", "serde", "bracketed-paste", "futures-core"] }
# 導入時は 0.17.1 だったが、cargo-deny が RUSTSEC-2024-0013 (libgit2 < 1.7.2 の
# 脆弱性: ヒープ破壊 / DoS / OOB read) と unsound 3 件 (RUSTSEC-2026-0008 /
# 0183 / 0184) を検出したため、実装で使う前に 0.21.0 へ上げた (ユーザー承認済み)。
# 0.17 系に戻す場合は deny.toml に理由付き ignore を足し、ローカルビルドに
# openssl + pkg-config が要る (libgit2-sys 0.15 は cc でビルドされ cmake は不要)。
git2 = "0.21.0"
nix = "0.26.2"
# 0.5.0 は tokio-io 0.1 (unmaintained) を引き込むため 0.9.2 へ更新 (ユーザー承認済み)。
# 0.9.2 でも nvim-rs が futures の io-compat を必須で有効にするため tokio-io は
# 残り、deny.toml の ignore (RUSTSEC-2026-0058) で理由付きで許容している。
nvim-rs = "0.9.2"
once_cell = "1.17.1"
regex = "1.7.3"
thiserror = "1.0.40"
windows = { version = "0.48", features = [
  "Data_Xml_Dom",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
