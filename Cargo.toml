[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"

# 依存は実装で必要になった時点でここに追加する。
# 追加したら cargo machete / cargo deny の設定も同時に見直す (deny.toml の
# 冒頭コメントに、戻すと引っかかる既知の項目をまとめてある)。
[workspace.dependencies]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
