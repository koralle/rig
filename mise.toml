# cargo-nextest / cargo-machete / cargo-deny は CI の tool: と同じバージョンに揃える
# (整合は mise run check-config が検査する)。
# rust は mise のグローバル設定 (RUSTUP_TOOLCHAIN) が rust-toolchain.toml を
# 上書きするため、ここでも同じ channel を明示する。
[tools]
rust = "1.99.0"
"cargo:cargo-nextest" = "0.9.144"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-deny" = "0.20.2"
"npm:lefthook" = "2.1.12"
# workflow / YAML の lint (CI の config ジョブも同じものを使う)
"github:rhysd/actionlint" = "1.7.12"
"pipx:yamllint" = "1.38.0"

[tasks.setup]
description = "開発環境をセットアップする"
# 初回は lefthook がまだ PATH にないため mise exec で再解決する
run = "mise install && mise exec -- lefthook install"

[tasks.fmt]
description = "コードを整形する"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "フォーマットをチェックする"
run = "cargo fmt --all -- --check"

# cargo を伴うタスクは --locked 付きで実行する。依存を足して Cargo.lock を
# 更新し忘れた状態を、ローカルでも CI でも失敗させるため (CI は --locked が無いと
# lock を書き換えて成功してしまい、古い lock がそのまま入る)。
[tasks.clippy]
description = "Clippy で lint する"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "テストを実行する (nextest)"
# テストが 0 件の間は nextest が exit 4 で落ちるため pass 扱いにする
run = "cargo nextest run --locked --workspace --all-features --no-tests=pass"

[tasks.test-doc]
description = "doc テストを実行する"
run = "cargo test --doc --locked --workspace --all-features"

[tasks.doc]
description = "rustdoc の警告 (壊れたリンクなど) をエラーにする"
# 壊れた intra-doc link は cargo test --doc では検出されないため cargo doc で見る
run = "RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --document-private-items --no-deps"

[tasks.machete]
description = "未使用クレートを検出する"
run = "cargo machete"

[tasks.deny]
description = "依存クレートのポリシー (脆弱性 / ライセンス) をチェックする"
run = "cargo deny --all-features --locked check"

[tasks.check-config]
description = "設定ファイル (workflow / YAML / ツールの版数) を検査する"
run = """
bash scripts/check-versions.sh
actionlint -color
yamllint -c .yamllint .github lefthook.yaml
"""

[tasks.check]
description = "フォーマット / Clippy / 設定ファイルをチェックする (pre-commit)"
depends = ["fmt-check", "clippy", "check-config"]

# depends は依存タスクを並列に起動する (cargo が build directory の lock で
# 待たされる) ため、直列を保証する目的で run から順に呼ぶ。
[tasks.ci]
description = "CI と同じチェックを直列で実行する"
run = """
mise run fmt-check
mise run check-config
mise run clippy
mise run doc
mise run test
mise run test-doc
mise run machete
mise run deny
"""
